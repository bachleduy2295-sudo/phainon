<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Góp ý thư viện</title>
    <style>
        body {
            font-family: Arial;
        }

        h1 {
            text-align: center;
        }

        .form-container {
            width: 600px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        textarea {
            height: 150px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Đóng góp ý kiến cho thư viện của nhà trường</h1>

    <div class="form-container">
        <h3>1. Thông tin về người góp ý</h3>

        <label>Họ và tên:</label>
        <input type="text">

        <label>Địa chỉ email:</label>
        <input type="email">

        <h3>2. Đóng góp ý kiến</h3>

        <label>Ý kiến đóng góp:</label>
        <textarea></textarea>

        <button>Gửi</button>
    </div>

</body>
</html>
